name: publicar
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
  push:
    paths: [respuestas.json, cola.json]
permissions: {contents: write, actions: write}
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      # GitHub drops many scheduled runs, so each run stays awake ~55 min, working every 5 min, and then starts the next run itself.
      - run: |
          git config user.name bioandante-bot; git config user.email bot@users.noreply.github.com
          fin=$(( $(date +%s) + 3300 ))
          n=0
          while :; do
            git pull -q --rebase -X theirs || true
            python3 publicar.py || true
            # Meta allows this app ~200 calls an hour: DMs every 10 min, the comments page every 30 min
            [ $((n % 2)) -eq 0 ] && { python3 dm_recursos.py || true; }
            # replies asked from the web go out every loop; reading all the comments, every 30 min
            if [ $((n % 6)) -eq 0 ]; then python3 comentarios.py || true; else python3 comentarios.py enviar || true; fi
            n=$((n + 1))
            git add cola.json hecho.json comentarios.json enviadas.json dm.json 2>/dev/null; git diff --cached --quiet || (git commit -qm "publicado" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done)
            [ $(date +%s) -ge $fin ] && break
            sleep 300
          done
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          YT_CLIENT: ${{ secrets.YT_CLIENT }}
          YT_REFRESH: ${{ secrets.YT_REFRESH }}
      - if: always()
        run: gh workflow run publicar --ref main -R ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
