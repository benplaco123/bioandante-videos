name: publicar
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
  push:
    paths: [respuestas.json, cola.json]
permissions: {contents: write}
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 publicar.py
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          YT_CLIENT: ${{ secrets.YT_CLIENT }}
          YT_REFRESH: ${{ secrets.YT_REFRESH }}
      - run: python3 comentarios.py || true
        env:
          YT_CLIENT: ${{ secrets.YT_CLIENT }}
          YT_REFRESH: ${{ secrets.YT_REFRESH }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
      - run: |
          git config user.name bioandante-bot; git config user.email bot@users.noreply.github.com
          git add cola.json hecho.json comentarios.json respuestas.json 2>/dev/null; git diff --cached --quiet || (git commit -qm "publicado" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done)
