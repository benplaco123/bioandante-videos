<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario bio.andante</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e1d8;--acc:#1f4e8c;--ig:#c13584;--fb:#1877f2;--yt:#e62117}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1f232b;--ink:#eceff4;--mute:#9aa3b2;--line:#2e333d;--acc:#7aa7e8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0;flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#estado{color:var(--mute);font-size:13px;padding:0 16px}
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px}
.dia{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.dia h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:600;text-transform:capitalize}
.dia.sobre{outline:2px dashed var(--acc)}
.t{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg);cursor:grab}
.t .h{font-weight:700;margin-right:6px}.t .x{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
.chips{display:flex;gap:6px;align-items:center}.chip{font-size:12px;border-radius:99px;padding:2px 8px;border:1px solid currentColor;cursor:pointer;opacity:.35;user-select:none}
.chip.on{opacity:1}.chip.ig{color:var(--ig)}.chip.fb{color:var(--fb)}.chip.yt{color:var(--yt)}.chip.pr{color:#b7791f}
input[type=time]{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:2px 4px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.c.ok{opacity:.55}.c small{color:var(--mute)}.c textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);color:var(--ink);margin:6px 0}.rr{border-left:3px solid var(--line);padding-left:8px;margin:6px 0;font-size:14px}.hecho{opacity:.6}.hecho .t{cursor:default}
#login{max-width:520px;margin:40px auto;padding:16px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
#login input{width:100%;padding:8px;font:inherit;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
</style></head><body>
<div id="login" hidden><h1>Calendario bio.andante</h1><p>Pega tu clave de GitHub (se guarda solo en este navegador).</p>
<input id="tok" type="password" autocomplete="off"><button class="pri" onclick="guardaTok()">Entrar</button></div>
<div id="app" hidden><header><h1>bio.andante</h1><button onclick="vista('cal')">Calendario</button><button onclick="vista('com')">Comentarios</button><button onclick="carga()">Recargar</button><button class="pri" id="g" onclick="guarda()" disabled>Guardar cambios</button></header>
<div id="estado"></div><div id="com" hidden style="padding:16px;max-width:760px"></div><div id="cal"><div class="dias" id="dias"></div><h2 style="padding:0 16px;font-size:15px">Publicado</h2><div class="dias hecho" id="hechos"></div></div></div>
<script>
const R='benplaco123/bioandante-videos';let T='',cola=[],sha='',sucio=false;
try{T=localStorage.getItem('ghtok')||''}catch(e){}
const gh=(p,o={})=>fetch('https://api.github.com/repos/'+R+'/contents/'+p,{cache:'no-store',...o,headers:{Authorization:'Bearer '+T,Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw r.status;return r.json()});
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
function guardaTok(){T=document.getElementById('tok').value.trim();try{localStorage.setItem('ghtok',T)}catch(e){}inicio()}
async function inicio(){if(!T){login.hidden=false;return}login.hidden=true;app.hidden=false;carga()}
async function carga(){estado.textContent='Cargando…';try{const f=await gh('cola.json?ref=main');sha=f.sha;cola=JSON.parse(dec(f.content));
let h=[];try{h=JSON.parse(dec((await gh('hecho.json?ref=main')).content))}catch(e){}pinta(h);sucio=false;g.disabled=true;estado.textContent=cola.length+' en espera'}
catch(e){estado.textContent='Error '+e+(e==401?' (clave no válida)':'');if(e==401){try{localStorage.removeItem('ghtok')}catch(_){}T='';inicio()}}}
const dia=s=>s.slice(0,10),hora=s=>s.slice(11,16);
function nombreDia(d){return new Date(d+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}
function pinta(h){const hoy=new Date().toISOString().slice(0,10);let ds=new Set(cola.map(e=>dia(e.hora)));let d0=new Date(hoy+'T12:00');
for(let i=0;i<14;i++){ds.add(new Date(d0.getTime()+i*864e5).toISOString().slice(0,10))}
ds=[...ds].sort();dias.innerHTML='';for(const d of ds){const c=document.createElement('div');c.className='dia';c.dataset.d=d;c.innerHTML='<h2>'+nombreDia(d)+'</h2>';
c.ondragover=e=>{e.preventDefault();c.classList.add('sobre')};c.ondragleave=()=>c.classList.remove('sobre');
c.ondrop=e=>{e.preventDefault();c.classList.remove('sobre');const i=+e.dataTransfer.getData('i');cola[i].hora=d+cola[i].hora.slice(10);cambio()};
cola.map((e,i)=>[e,i]).filter(([e])=>dia(e.hora)==d).sort((a,b)=>a[0].hora<b[0].hora?-1:1).forEach(([e,i])=>c.appendChild(tarjeta(e,i)));dias.appendChild(c)}
hechos.innerHTML=h.slice(-12).reverse().map(x=>'<div class="dia"><h2>'+(x.hora_real||'').slice(0,16).replace('T',' ')+'</h2><div class="t"><div class="x">'+x.nombre+'</div>'+['instagram','facebook','youtube'].filter(k=>x[k]).map(k=>'<div style="font-size:12px">'+k+': '+String(x[k]).replace(/</g,'&lt;')+'</div>').join('')+'</div></div>').join('')}
function tarjeta(e,i){const t=document.createElement('div');t.className='t';t.draggable=true;t.ondragstart=ev=>ev.dataTransfer.setData('i',i);
const ch=(k,l,c)=>'<span class="chip '+c+(e[k]??(k=='instagram')?' on':'')+'" data-k="'+k+'">'+l+'</span>';
t.innerHTML='<div class="chips"><input type="time" value="'+hora(e.hora)+'">'+ch('instagram','IG','ig')+ch('facebook','FB','fb')+ch('youtube','YT','yt')+ch('prueba','Prueba','pr')+'</div><div class="x"></div>';
t.querySelector('.x').textContent=e.titulo||e.texto||e.nombre;
t.querySelector('input').onchange=ev=>{e.hora=dia(e.hora)+'T'+ev.target.value+e.hora.slice(16);cambio()};
t.querySelectorAll('.chip').forEach(s=>s.onclick=()=>{const k=s.dataset.k;e[k]=!(e[k]??(k=='instagram'));if(k=='prueba'&&e.prueba){e.instagram=true;e.facebook=false;e.youtube=false}cambio()});
// mover en el móvil: tocar el día de arriba/abajo
return t}
function cambio(){sucio=true;g.disabled=false;estado.textContent='Cambios sin guardar';pinta([])}
async function guarda(){estado.textContent='Guardando…';try{const r=await gh('cola.json',{method:'PUT',body:JSON.stringify({message:'calendario: cambios desde la web',content:enc(JSON.stringify(cola,null,1)),sha,branch:'main'})});
sha=r.content.sha;estado.textContent='Guardado ✓';sucio=false;g.disabled=true;carga()}catch(e){estado.textContent='No se pudo guardar ('+e+'). Recarga y vuelve a probar.'}}

function vista(v){cal.hidden=v!='cal';com.hidden=v!='com';if(v=='com')cargaCom()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function cargaCom(){estado.textContent='Cargando comentarios…';let L=[],P=[];
try{L=JSON.parse(dec((await gh('comentarios.json?ref=main&t='+Date.now())).content))}catch(e){}
try{P=JSON.parse(dec((await gh('respuestas.json?ref=main&t='+Date.now())).content))}catch(e){}
const pend=new Set(P.map(a=>a.id));L=L.filter(c=>!c.oculto&&(!window._red||c.red==_red));L.forEach(c=>{const r=c.respuestas||[];if(r.length&&r[r.length-1].quien!=='bio.andante'&&c.red!=='facebook')c.respondido=false});L.sort((a,b)=>(a.respondido-b.respondido)||(a.hora<b.hora?1:-1));
const n=L.filter(c=>!c.respondido).length;estado.textContent=n+' sin responder · se actualiza cada 5 min';
com.innerHTML='<div class="chips" style="margin-bottom:12px">'+[['','Todas'],['instagram','Instagram'],['facebook','Facebook'],['youtube','YouTube']].map(([k,l])=>'<button '+((window._red||'')==k?'class="pri"':'')+' onclick="_red=\''+k+'\';cargaCom()">'+l+'</button>').join('')+'</div>'+L.map((c,i)=>'<div class="c'+(c.respondido?' ok':'')+'"><small>'+({instagram:'IG',facebook:'FB',youtube:'YT'}[c.red])+' · '+esc((c.hora||'').slice(0,16).replace('T',' '))+' · <a href="'+esc(c.enlace)+'" target="_blank">'+esc(c.video)+'</a></small><div><b>'+esc(c.quien)+'</b> '+esc(c.texto)+'</div>'+
(c.respuestas||[]).map(r=>'<div class="rr"><b>'+esc(r.quien)+'</b> '+esc(r.texto)+(r.quien!=='bio.andante'&&!pend.has(c.id)?' <a href="#" onclick="const t=document.getElementById(\'r'+i+'\');t.value=\'@'+esc(r.quien).replace(/\'/g,'')+' \'+t.value;t.focus();return false">responder</a>':'')+'</div>').join('')+
(pend.has(c.id)?'<small>⏳ en cola, sale en menos de 10 min</small>':'<textarea rows="2" id="r'+i+'" placeholder="Tu respuesta…"></textarea><button class="pri" onclick="accion('+i+')">Responder</button> <button onclick="accion('+i+',1)">Ocultar</button>')+'</div>').join('')||'<p>No hay comentarios todavía.</p>';
window._L=L}
async function accion(i,ocultar){const c=_L[i];const t=ocultar?'':document.getElementById('r'+i).value.trim();if(!ocultar&&!t)return;
if(ocultar&&!confirm('¿Ocultar este comentario?'))return;estado.textContent='Enviando…';
for(let k=0;k<3;k++){try{const f=await gh('respuestas.json?ref=main&t='+Date.now());const P=JSON.parse(dec(f.content));P.push(ocultar?{red:c.red,id:c.id,ocultar:true}:{red:c.red,id:c.id,texto:t});
await gh('respuestas.json',{method:'PUT',body:JSON.stringify({message:'respuesta desde la web',content:enc(JSON.stringify(P,null,1)),sha:f.sha,branch:'main'})});const b=document.getElementById('r'+i).parentNode;b.querySelectorAll('textarea,button').forEach(x=>x.remove());b.insertAdjacentHTML('beforeend','<small>✅ '+(ocultar?'Se ocultará':'Enviada')+'. Sale en menos de 10 min.</small>');b.classList.add('ok');estado.textContent='Enviado ✓';return}catch(e){}}
estado.textContent='No se pudo enviar. Recarga y prueba otra vez.'}
window.onbeforeunload=()=>sucio?true:undefined;inicio();
</script></body></html>
